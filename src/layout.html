<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<!-- Canonical and og URLs point at the review deployment; switch SITE in scripts/build.py to the production domain at launch -->
<link rel="canonical" href="{{url}}">
<meta property="og:type" content="{{og_type}}">
<meta property="og:site_name" content="Two Shadows">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{url}}">
<meta property="og:image" content="{{site}}/assets/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Two Shadows Gut &amp; Digestion soft chews: Good days start with a happy gut">
<meta property="og:locale" content="en_GB">
<meta name="twitter:card" content="summary_large_image">
<link rel="preload" href="/assets/fonts/anton-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/plex-condensed-400.woff2" as="font" type="font/woff2" crossorigin>
{{preload}}<link rel="stylesheet" href="/assets/site.css">
{{jsonld}}
</head>
<body>
{{> announce-header}}
<main>
{{body}}
</main>
{{> footer}}
{{scripts}}
</body>
</html>
